version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: enterprise-mlops-pipeline:latest
    container_name: mlops-pipeline-runner

    volumes:
      - .:/app
      - /app/__pycache__ 

    env_file:
      - .env.example

    environment:
      - PYTHONPATH=/app
      - DVC_NO_ANALYTICS=true

    healthcheck:
      test: ["CMD", "python", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    command: ["dvc", "repro"]

    stdin_open: true
    tty: true

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: enterprise-mlops-pipeline:test
    container_name: mlops-test-runner

    volumes:
      - .:/app

    environment:
      - PYTHONPATH=/app

    working_dir: /app
    command: ["pytest", "tests/", "-v", "--tb=short"]

    profiles:
      - test
