base:
  random_state: 42
  log_level: INFO
  project_name: enterprise-mlops-pipeline

data:
  raw_data_path: data/adult.csv
  processed_data_path: data/processed.csv
  features_path: data/features.npz
  target_column: income
  test_size: 0.2

featurize:
  add_interaction_features: true

train:
  model_type: lightgbm
  n_estimators: 800
  max_depth: 6
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_jobs: -1
  # Random-forest fallback params (used when model_type=random_forest)
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt

evaluate:
  metrics_path: metrics/scores.json
  model_path: models/model.joblib
  threshold: 0.5
