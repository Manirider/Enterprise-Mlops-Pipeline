stages:

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/utils/logger.py
      - src/utils/config.py
      - src/utils/paths.py
      - data/adult.csv
    params:
      - params.yaml:
          - base.random_state
          - base.log_level
          - data.raw_data_path
          - data.processed_data_path
          - data.target_column
    outs:
      - data/processed.csv

  featurize:
    cmd: python src/featurize.py
    deps:
      - src/featurize.py
      - src/utils/logger.py
      - src/utils/config.py
      - src/utils/paths.py
      - data/processed.csv
    params:
      - params.yaml:
          - base.random_state
          - data.processed_data_path
          - data.features_path
          - data.target_column
          - data.test_size
          - featurize.add_interaction_features
    outs:
      - data/features.npz

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/utils/logger.py
      - src/utils/config.py
      - src/utils/paths.py
      - src/utils/helpers.py
      - data/features.npz
    params:
      - params.yaml:
          - base.random_state
          - train.model_type
          - train.n_estimators
          - train.max_depth
          - train.learning_rate
          - train.subsample
          - train.colsample_bytree
          - train.min_child_samples
          - train.reg_alpha
          - train.reg_lambda
          - train.min_samples_split
          - train.min_samples_leaf
          - train.max_features
          - train.n_jobs
          - evaluate.model_path
    outs:
      - models/model.joblib

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/utils/logger.py
      - src/utils/config.py
      - src/utils/metrics.py
      - src/utils/paths.py
      - models/model.joblib
      - data/features.npz
    params:
      - params.yaml:
          - evaluate.metrics_path
          - evaluate.model_path
          - evaluate.threshold
    metrics:
      - metrics/scores.json:
          cache: false
